name = "MyResearches_LLM_Lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MyResearchesLLMLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "MyResearchesLLMLean"
